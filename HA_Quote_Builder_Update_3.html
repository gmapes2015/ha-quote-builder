<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f9b"><title>H&A Quote Builder</title><style>:root{font-family:system-ui,sans-serif;color:#17384a;background:#e9f8fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#087f9b,#13b8ae);color:white;padding:22px 16px}main{max-width:760px;margin:auto;padding:16px}.card{background:white;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #12546a19}h1{margin:0;font-size:26px}h2{margin:0 0 14px}label{display:block;font-weight:700;margin:12px 0 5px}input,select,textarea{width:100%;padding:13px;border:2px solid #9bd7dd;border-radius:12px;font-size:17px;background:white}button{border:0;border-radius:13px;background:#ff921c;color:#172b37;padding:14px 18px;font-size:17px;font-weight:800;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#d2f0f3}button.danger{background:#ffdad6}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1;min-width:0}.pill{display:inline-block;background:#c9f5e3;padding:7px 12px;border-radius:20px}.muted{color:#537080;font-size:14px}.warn{color:#a92222;background:#ffe3df;border-radius:12px;padding:10px}.ok{color:#08764d}.hidden{display:none}.big{font-size:30px;font-weight:900;color:#007f92}.step{color:#087f9b;font-weight:800}.line{border-bottom:1px solid #cde6ea;padding:10px 0}nav{display:flex;flex-wrap:wrap;gap:6px}nav button{flex:1}summary{cursor:pointer;font-weight:800}small{display:block}.progress{height:12px;background:#cce6e9;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:#ff921c;transition:width .2s}@media print{header,button,nav,.no-print,details{display:none!important}body{background:white}.card{box-shadow:none;border:1px solid #ddd}main{max-width:none}}.measure-card{padding:14px;border:1px solid #c7e5e9;border-radius:15px;margin:12px 0;background:#f5fcfd}.measure-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}.feet-inch{display:grid;grid-template-columns:1fr 1fr;gap:6px}.feet-inch input{width:100%;min-width:0;padding:10px 6px}.feet-inch small{font-size:12px;color:#526d78}.measure-card .danger{margin-top:8px}@media(max-width:360px){.measure-grid{grid-template-columns:1fr}}</style><style>.room-options{display:grid;gap:9px;margin:18px 0}.room-option{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border:2px solid #cfe8eb;border-radius:16px;background:#fff}.room-option.chosen{background:#e2f7ee;border-color:#35a987}.room-check{display:flex;align-items:center;gap:12px;flex:1;margin:0!important;font-size:18px;font-weight:700;cursor:pointer}.room-check input{width:26px;height:26px;min-width:26px;accent-color:#179d83;margin:0}.room-quantity{display:flex;align-items:center;gap:10px}.room-quantity button{width:43px!important;min-width:43px!important;padding:8px 0!important;margin:0!important;font-size:24px!important}.room-quantity strong{min-width:22px;text-align:center;font-size:19px}.selected-count{font-weight:800;color:#167a68;font-size:19px}@media(max-width:390px){.room-check{font-size:16px}.room-option{padding:9px 7px}.room-quantity{gap:5px}}.surface-option{display:flex;align-items:center;gap:14px;background:#f1fbfc;border:2px solid #cfe8eb;padding:16px;border-radius:14px;font-size:18px}.surface-option input{width:27px;height:27px;accent-color:#0d9b91} .measure-card{padding:14px;border:1px solid #c7e5e9;border-radius:15px;margin:12px 0;background:#f5fcfd}.measure-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}.feet-inch{display:grid;grid-template-columns:1fr 1fr;gap:6px}.feet-inch input{width:100%;min-width:0;padding:10px 6px}.feet-inch small{font-size:12px;color:#526d78}.measure-card .danger{margin-top:8px}@media(max-width:360px){.measure-grid{grid-template-columns:1fr}}</style></head><body><header><h1>🌊 H&A Jacks of All Trades</h1><div>🧰 Quote Builder · Painting Edition</div></header><main><div id="app"></div></main><script>
const KEY='ha-paint-v3';const defaults={wall:2.5,color:3,difficult:3.5,ceiling:3.3,premium:4,base:2.5,newbase:4,door:100,frame:45,materialMarkup:30,prep:[0,5,12,25,45],repair:[0,5,12,25,45],dailyTarget:1000,ownerDay:300,helperDay:125,momDay:200,ownerHour:30,targetHour:60};let store=JSON.parse(localStorage.getItem(KEY)||'{"jobs":[],"rates":null}');store.rates={...defaults,...store.rates};let job=null,screen='home',roomIndex=0,stage=0;const $=id=>document.getElementById(id),money=n=>(Number(n)||0).toLocaleString('en-US',{style:'currency',currency:'USD'}),num=n=>Math.max(0,Number(n)||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){if(job){job.updated=new Date().toISOString();let i=store.jobs.findIndex(x=>x.id===job.id);if(i<0)store.jobs.push(job);else store.jobs[i]=job}localStorage.setItem(KEY,JSON.stringify(store));let status=$('saved');if(status)status.textContent='✓ Saved '+new Date().toLocaleTimeString()}setInterval(save,60000);window.addEventListener('pagehide',save);function makeRoom(name){return{name,surfaces:['walls'],otherDescription:'',measure:[{l:0,li:0,h:8,hi:0}],deductions:[],ceilingMeasure:[{l:0,li:0,w:0,wi:0}],ceiling:0,ceilingCoats:2,ceilingType:'none',wallType:'standard',texture:'Smooth/light',repair:0,prep:0,furniture:0,doors:0,frames:0,base:0,newbase:0,coats:2,photos:[],notes:''}}function newJob(){job={id:Date.now().toString(),name:'',client:'',property:'Condo',created:new Date().toISOString(),updated:new Date().toISOString(),rooms:[],materials:0,days:0,momDays:0,original:null,changeOrders:[]};screen='setup';render()}function feet(ft,inch){return num(ft)+num(inch)/12}
function roomArea(r){return r.measure.reduce((s,m)=>s+feet(m.l,m.li)*feet(m.h,m.hi),0)}
function ceilingArea(r){return (r.ceilingMeasure||[]).reduce((s,m)=>s+feet(m.l,m.li)*feet(m.w,m.wi),0)}
function deduction(r){return r.deductions.reduce((s,d)=>s+feet(d.w,d.wi)*feet(d.h,d.hi),0)}function roomCost(r){let chosen=r.surfaces||['walls'];let area=chosen.includes('walls')?Math.max(0,roomArea(r)-deduction(r)):0,rate=store.rates[r.wallType==='color'?'color':r.wallType==='difficult'?'difficult':'wall'];let walls=area*rate*(num(r.coats)/2),ceil=chosen.includes('ceilings')?(ceilingArea(r)||num(r.ceiling))*(r.ceilingType==='premium'?store.rates.premium:store.rates.ceiling)*(num(r.ceilingCoats??2)/2):0;let base=chosen.includes('trim')?(num(r.base)*store.rates.base+num(r.newbase)*store.rates.newbase):0;let doors=chosen.includes('doors')?(num(r.doors)*store.rates.door+num(r.frames)*store.rates.frame):0;let sub=walls+ceil+base+doors;let extra=sub*(store.rates.prep[r.prep]+store.rates.repair[r.repair]+store.rates.prep[r.furniture])/100;return {area,walls,ceil,base,doors,extra,total:sub+extra}}function totals(){let labor=job.rooms.reduce((s,r)=>s+roomCost(r).total,0),materials=num(job.materials)*(1+store.rates.materialMarkup/100),total=labor+materials,cost=num(job.days)*(store.rates.ownerDay+store.rates.helperDay)+num(job.momDays)*store.rates.momDay+num(job.materials);return{labor,materials,total,cost,remaining:total-cost}}function title(s){return `<div class="card"><div class="step">${esc(job?.name||'New Estimate')}</div><h2>${s}</h2><div class="muted" id="saved">✓ Autosave enabled (this device)</div></div>`}function render(){let a=$('app');if(screen==='home'){a.innerHTML=`<div class="card"><h2>Welcome back! 👋</h2><button onclick="newJob()">➕ New painting quote</button><button class="secondary" onclick="screen='settings';render()">⚙️ Business settings</button><p class="muted">Other service categories coming later.</p></div><div class="card"><h2>📂 Saved jobs</h2><input id="search" placeholder="Search name, client, date…" oninput="showJobs()"><div id="jobs"></div></div>`;showJobs();return}if(screen==='settings'){a.innerHTML=`<div class="card"><h2>🔒 Business pricing settings</h2><p class="muted">Changes affect future calculations. Keep these consistent; existing signed quotes should be exported before changing rates.</p>${Object.keys(defaults).filter(k=>!Array.isArray(defaults[k])).map(k=>`<label>${esc(k)}</label><input type="number" step=".01" data-rate="${k}" value="${store.rates[k]}">`).join('')}<button onclick="updateRates()">Save pricing profile</button><button class="secondary" onclick="screen='home';render()">Back</button></div>`;return}if(screen==='setup'){a.innerHTML=title('🏠 Job details')+`<div class="card"><label>Job name</label><input id="jobname" value="${esc(job.name)}" placeholder="Aqua 406"><label>Client</label><input id="client" value="${esc(job.client)}" placeholder="Eddie"><label>Property type</label><select id="property">${['Condo','House','Garage','Shed','Commercial','Other'].map(x=>`<option ${job.property===x?'selected':''}>${x}</option>`).join('')}</select><button onclick="setupNext()">Next: Choose rooms ➜</button><button class="secondary" onclick="save();screen='home';render()">Save & exit</button></div>`;return}if(screen==='rooms'){const types=['Foyer','Living Room','Dining Room','Kitchen','Bedroom','Bathroom','Half Bathroom','Primary Bedroom','Primary Bathroom','Hallway','Closet','Walk-in Closet','Laundry Room','Utility Room','Pantry','Office','Sunroom','Stairwell','Garage','Porch','Other'];let counts={};types.forEach(t=>counts[t]=job.rooms.filter(r=>roomMatchesType(r.name,t)).length);a.innerHTML=title('🚪 Choose rooms')+`<div class="card"><p class="muted">Check each room type. Use + or − for multiple rooms of the same type.</p><div class="room-options">${types.map(t=>`<div class="room-option ${counts[t]?'chosen':''}"><label class="room-check"><input type="checkbox" ${counts[t]?'checked':''} onchange="toggleRoomType('${t}',this.checked)"><span>${esc(t)}</span></label><div class="room-quantity"><button class="secondary" aria-label="Remove one ${esc(t)}" onclick="changeRoomCount('${t}',-1)" ${counts[t]?'':'disabled'}>−</button><strong>${counts[t]}</strong><button class="secondary" aria-label="Add one ${esc(t)}" onclick="changeRoomCount('${t}',1)">+</button></div></div>`).join('')}</div><p class="selected-count">✓ ${job.rooms.length} room${job.rooms.length===1?'':'s'} selected</p><button onclick="roomIndex=0;stage=0;screen='wizard';save();render()" ${job.rooms.length?'':'disabled'}>Start room walkthrough ➜</button><button class="secondary" onclick="screen='setup';render()">Back</button></div>`;return}if(screen==='wizard'){if(roomIndex>=job.rooms.length){screen='review';render();return}let r=job.rooms[roomIndex],chosen=r.surfaces||['walls'];let steps=['What are we painting?','Wall measurements','Wall deductions','Ceiling measurements','Surfaces and finish','Cosmetic repairs','Painting preparation','Fixtures and furniture','Room notes'];let body='';if(stage===0){body=`<p class="muted">Check everything included in ${esc(r.name)}. Unchecked surfaces will not be priced.</p>${[['ceilings','Ceilings'],['walls','Walls'],['trim','Trim & baseboards'],['doors','Doors & frames'],['other','Other']].map(([key,label])=>`<label class="surface-option"><input type="checkbox" ${chosen.includes(key)?'checked':''} onchange="toggleSurface('${key}',this.checked)"> ${label}</label>`).join('')}${chosen.includes('other')?`<label>Describe other painting work</label><textarea placeholder="Cabinets, beams, railings…" onchange="setRoom('otherDescription',this.value)">${esc(r.otherDescription||'')}</textarea><p class="muted">Custom work is included in the scope but must be priced separately; it is not automatically added to the total.</p>`:''}`;}if(stage===1){body=`<p>Enter the combined linear length of walls sharing the same height. Feet and inches are separate.</p>${r.measure.map((m,i)=>`<div class="measure-card"><strong>Wall measurement ${i+1}</strong><div class="measure-grid">${dimFields('Total wall length',m,'l','li',`setMeasure(${i},`,')')}${dimFields('Wall height',m,'h','hi',`setMeasure(${i},`,')')}</div><button class="danger" onclick="removeMeasure(${i})">Remove row</button></div>`).join('')}<button class="secondary" onclick="rAddMeasure()">+ Add wall measurement</button><p class="big">${roomArea(r).toFixed(2)} sq ft</p>`}if(stage===2){body=`<p>Subtract only areas that won't be painted.</p>${r.deductions.map((d,i)=>`<div class="measure-card"><input aria-label="Deduction description" value="${esc(d.name||'')}" placeholder="Vanity / shower / door" onchange="setDed(${i},'name',this.value)"><div class="measure-grid">${dimFields('Width',d,'w','wi',`setDed(${i},`,')')}${dimFields('Height',d,'h','hi',`setDed(${i},`,')')}</div><button class="danger" onclick="job.rooms[roomIndex].deductions.splice(${i},1);save();render()">Remove deduction</button></div>`).join('')}<button class="secondary" onclick="rAddDed()">+ Add deduction</button><p>Gross: ${roomArea(r).toFixed(2)} sq ft · Deductions: ${deduction(r).toFixed(2)} sq ft</p><p class="big">Net: ${(roomArea(r)-deduction(r)).toFixed(2)} sq ft</p>${deduction(r)>roomArea(r)?'<div class="warn">🔴 Deductions exceed gross wall area. Recheck measurements.</div>':''}`;}if(stage===3){body=`<p>Measure each ceiling section by length × width. Use feet and inches for both dimensions.</p>${(r.ceilingMeasure||[]).map((m,i)=>`<div class="measure-card"><strong>Ceiling section ${i+1}</strong><div class="measure-grid">${dimFields('Length',m,'l','li',`setCeilingMeasure(${i},`,')')}${dimFields('Width',m,'w','wi',`setCeilingMeasure(${i},`,')')}</div><button class="danger" onclick="removeCeilingMeasure(${i})">Remove section</button></div>`).join('')}<button class="secondary" onclick="addCeilingMeasure()">+ Add ceiling section</button><p class="big">${ceilingArea(r).toFixed(2)} sq ft</p>`;}if(stage===4){body=`${chosen.includes('walls')?fieldSelect('Wall difficulty','wallType',[['standard','Standard'],['color','Major color change'],['difficult','Difficult surface']],r)+fieldSelect('Wall texture','texture',[['Smooth/light','Smooth/light'],['Orange peel','Orange peel'],['Knockdown','Knockdown'],['Heavy','Heavy']],r)+`<label>Wall finish coats</label><input type="number" min="1" max="10" value="${r.coats}" onchange="setRoom('coats',this.value)">`:''}${chosen.includes('ceilings')?`<p class="big">Ceiling: ${ceilingArea(r).toFixed(2)} sq ft</p>${fieldSelect('Ceiling texture','ceilingTexture',[['Smooth','Smooth'],['Orange peel','Orange peel'],['Knockdown','Knockdown'],['Popcorn','Popcorn'],['Other','Other']],r)}${fieldSelect('Ceiling condition','ceilingCondition',[['Good','Good'],['Minor repairs','Minor repairs'],['Stained','Stained / needs primer'],['Damaged','Damaged']],r)}<label>Ceiling finish coats</label><input type="number" min="1" max="10" value="${r.ceilingCoats??2}" onchange="setRoom('ceilingCoats',this.value)">${fieldSelect('Ceiling paint','ceilingType',[['flat','Flat'],['premium','Premium washable']],{...r,ceilingType:r.ceilingType==='none'?'flat':r.ceilingType})}`:''}${chosen.includes('trim')?`<div class="row"><div><label>Existing baseboard (ft)</label><input type="number" value="${r.base}" onchange="setRoom('base',this.value)"></div><div><label>New baseboard (ft)</label><input type="number" value="${r.newbase}" onchange="setRoom('newbase',this.value)"></div></div>`:''}${chosen.includes('doors')?`<div class="row"><div><label>Door faces</label><input type="number" value="${r.doors}" onchange="setRoom('doors',this.value)"></div><div><label>Door frames</label><input type="number" value="${r.frames}" onchange="setRoom('frames',this.value)"></div></div>`:''}${chosen.includes('other')?`<p><strong>Other:</strong> ${esc(r.otherDescription||'Not described yet')}</p><p class="warn">Other work requires a separate price before this estimate is final.</p>`:''}`;}if(stage===5)body=level('Cosmetic repair','repair',r)+'<p class="muted">Drywall patching, nail holes, caulking, sanding and minor surface repair.</p>';if(stage===6)body=level('Painting preparation','prep',r)+'<p class="muted">Masking, drop cloths, removing covers, protecting fixtures and setup.</p>';if(stage===7)body=level('Furniture moving','furniture',r)+'<p class="muted">Choose none if the room is empty or the owner has cleared it.</p>';if(stage===8)body=`<label>Room notes</label><textarea rows="4" onchange="setRoom('notes',this.value)">${esc(r.notes)}</textarea><p class="muted">Room photos will be added in a later version.</p>`;a.innerHTML=title(`Room ${roomIndex+1} of ${job.rooms.length}: ${esc(r.name)}`)+`<div class="card"><div class="step">Step ${stage+1} of ${steps.length}</div><div class="progress"><div style="width:${(stage+1)/steps.length*100}%"></div></div><h2 style="margin-top:15px">${steps[stage]}</h2>${body}<nav><button class="secondary" onclick="backStep()">← Back</button><button onclick="nextStep()">${stage===8?'Finish room ✓':'Next ➜'}</button></nav><button class="secondary" onclick="save();screen='rooms';render()">Room list</button><button class="secondary" onclick="save();screen='home';render()">Save & exit</button></div>`;return}if(screen==='review'){let t=totals();a.innerHTML=title('🧾 Estimate review')+`<div class="card"><h2>Room breakdown</h2>${job.rooms.map((r,i)=>{let c=roomCost(r);return `<div class="line"><strong>${esc(r.name)}</strong><div>${c.area.toFixed(1)} sq ft walls · ${money(c.total)}</div><button class="secondary" onclick="roomIndex=${i};stage=0;screen='wizard';render()">Edit room</button></div>`}).join('')}<label>Purchased materials ($)</label><input type="number" value="${job.materials}" onchange="job.materials=num(this.value);save();render()"><label>Estimated crew days (you + Brian)</label><input type="number" step=".5" value="${job.days}" onchange="job.days=num(this.value);save();render()"><label>Additional days for Mom</label><input type="number" step=".5" value="${job.momDays}" onchange="job.momDays=num(this.value);save();render()"><div class="line">Painting & prep: ${money(t.labor)}</div><div class="line">Materials with 30% markup: ${money(t.materials)}</div><div class="big">${money(t.total)}</div><details><summary>🔒 Private profitability check</summary><p>Estimated direct costs: ${money(t.cost)}</p><p>Remaining before overhead, taxes and profit: ${money(t.remaining)}</p><p>Labor revenue target: ${money(job.days*store.rates.dailyTarget)}</p><p class="muted">Owner $300/day, helper $125/day including bonus reserve; Mom $200/day when scheduled. This is not a customer-facing invoice.</p></details><button onclick="screen='customer';save();render()">Preview customer quote ➜</button><button class="secondary" onclick="screen='rooms';render()">Add / edit rooms</button><button class="secondary" onclick="save();screen='home';render()">Save & exit</button></div>`;return}if(screen==='customer'){let t=totals();a.innerHTML=`<div class="card"><h1>H&A Jacks of All Trades</h1><p>Painting Estimate · ${esc(job.name)}</p><p>Customer: ${esc(job.client)} · ${esc(job.property)}</p><p>Date: ${new Date().toLocaleDateString()}</p>${job.rooms.map(r=>`<div class="line">${esc(r.name)} — ${money(roomCost(r).total)}<small>${roomCost(r).area.toFixed(1)} sq ft wall area · ${(r.surfaces||['walls']).join(', ')}${(r.surfaces||[]).includes('other')?' · Other: '+esc(r.otherDescription||'Not specified'):''}</small></div>`).join('')}<div class="line">Materials & supplies: ${money(t.materials)}</div><h2>Total: ${money(t.total)}</h2><p class="muted">Scope is limited to listed surfaces and specifications. Additional work requires approval by change order.</p></div><div class="no-print"><button onclick="window.print()">🖨️ Print / Save as PDF</button><button class="secondary" onclick="screen='review';render()">Back</button><button class="secondary" onclick="save();screen='home';render()">Save & exit</button></div>`;return}}
function fieldSelect(label,key,options,r){return `<label>${label}</label><select onchange="setRoom('${key}',this.value)">${options.map(([v,n])=>`<option value="${v}" ${r[key]===v?'selected':''}>${n}</option>`).join('')}</select>`}function level(label,key,r){return fieldSelect(label,key,[['0','None'],['1','Minimum'],['2','Medium'],['3','Heavy'],['4','Extreme']],{[key]:String(r[key])})}function dimFields(label,m,ftKey,inKey,prefix,suffix){return `<div><label>${label}</label><div class="feet-inch"><div><small>Feet</small><input type="number" min="0" step="1" value="${m[ftKey]??0}" onchange="${prefix}'${ftKey}',this.value${suffix}"></div><div><small>Inches</small><input type="number" min="0" max="11.99" step=".25" value="${m[inKey]??0}" onchange="${prefix}'${inKey}',this.value${suffix}"></div></div></div>`}
function setCeilingMeasure(i,k,v){job.rooms[roomIndex].ceilingMeasure[i][k]=num(v);save();render()}
function addCeilingMeasure(){(job.rooms[roomIndex].ceilingMeasure ||= []).push({l:0,li:0,w:0,wi:0});save();render()}
function removeCeilingMeasure(i){let m=job.rooms[roomIndex].ceilingMeasure;if(m.length>1)m.splice(i,1);save();render()}
function setRoom(k,v){job.rooms[roomIndex][k]=['coats','ceiling','ceilingCoats','base','newbase','doors','frames','repair','prep','furniture'].includes(k)?num(v):v;save()}function setMeasure(i,k,v){job.rooms[roomIndex].measure[i][k]=num(v);save();if(stage===1)render()}function setDed(i,k,v){job.rooms[roomIndex].deductions[i][k]=k==='name'?v:num(v);save();if(k!=='name')render()}function rAddMeasure(){let r=job.rooms[roomIndex];r.measure.push({l:0,li:0,h:r.measure.at(-1)?.h||8,hi:r.measure.at(-1)?.hi||0});save();render()}function removeMeasure(i){let m=job.rooms[roomIndex].measure;if(m.length>1)m.splice(i,1);save();render()}function rAddDed(){job.rooms[roomIndex].deductions.push({name:'',w:0,h:0});save();render()}function toggleSurface(key,checked){let r=job.rooms[roomIndex];r.surfaces=r.surfaces||['walls'];r.surfaces=checked?[...new Set([...r.surfaces,key])]:r.surfaces.filter(x=>x!==key);if(key==='ceilings'&&checked){if(r.ceilingType==='none')r.ceilingType='flat';r.ceilingMeasure ||= [{l:0,li:0,w:0,wi:0}];}save();render()}function skipStage(){let r=job.rooms[roomIndex],c=r.surfaces||['walls'];if(stage===1||stage===2)return !c.includes('walls');if(stage===3)return !c.includes('ceilings');if(stage===4)return !c.some(x=>['walls','ceilings','trim','doors','other'].includes(x));return false}function nextStep(){save();if(stage<8){do{stage++}while(stage<8&&skipStage())}else{roomIndex++;stage=0}render()}function backStep(){if(stage>0){do{stage--}while(stage>0&&skipStage())}else if(roomIndex>0){roomIndex--;stage=8}else{screen='rooms'}render()}function setupNext(){job.name=$('jobname').value.trim()||'Untitled estimate';job.client=$('client').value.trim();job.property=$('property').value;save();screen='rooms';render()}function roomMatchesType(name,type){if(name===type)return true;if(!name.startsWith(type+' '))return false;let suffix=name.slice(type.length+1);return /^[0-9]+$/.test(suffix)}function changeRoomCount(type,delta){let matches=job.rooms.filter(r=>roomMatchesType(r.name,type));if(delta>0){let used=new Set(matches.map(r=>r.name));let n=1;while(used.has(n===1?type:type+' '+n))n++;job.rooms.push(makeRoom(n===1?type:type+' '+n))}else if(matches.length){let last=matches[matches.length-1];job.rooms.splice(job.rooms.indexOf(last),1)}save();render()}function toggleRoomType(type,checked){let matches=job.rooms.filter(r=>roomMatchesType(r.name,type));if(checked&&!matches.length)changeRoomCount(type,1);else if(!checked&&matches.length){job.rooms=job.rooms.filter(r=>!roomMatchesType(r.name,type));save();render()}}function addRoom(){let name=$('roomtype').value;let count=job.rooms.filter(r=>r.name.startsWith(name)).length;job.rooms.push(makeRoom(name+(count?' '+(count+1):'')));save();render()}function showJobs(){let q=($('search')?.value||'').toLowerCase();$('jobs').innerHTML=store.jobs.filter(j=>(j.name+' '+j.client+' '+j.created).toLowerCase().includes(q)).sort((a,b)=>b.updated.localeCompare(a.updated)).map(j=>`<div class="line"><strong>${esc(j.name||'Untitled')}</strong><small>${esc(j.client)} · ${new Date(j.updated).toLocaleDateString()}</small><button onclick="openJob('${j.id}')">Continue ➜</button><button class="danger" onclick="deleteJob('${j.id}')">Delete</button></div>`).join('')||'<p class="muted">No saved jobs yet.</p>'}function openJob(id){job=store.jobs.find(j=>j.id===id);screen='review';render()}function deleteJob(id){if(confirm('Delete this saved job?')){store.jobs=store.jobs.filter(j=>j.id!==id);save();render()}}function updateRates(){document.querySelectorAll('[data-rate]').forEach(el=>store.rates[el.dataset.rate]=num(el.value));save();screen='home';render()}render();
</script></body></html>
