<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f9b"><title>H&A Quote Builder</title><style>:root{font-family:system-ui,sans-serif;color:#17384a;background:#e9f8fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#087f9b,#13b8ae);color:white;padding:22px 16px}main{max-width:760px;margin:auto;padding:16px}.card{background:white;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #12546a19}h1{margin:0;font-size:26px}h2{margin:0 0 14px}label{display:block;font-weight:700;margin:12px 0 5px}input,select,textarea{width:100%;padding:13px;border:2px solid #9bd7dd;border-radius:12px;font-size:17px;background:white}button{border:0;border-radius:13px;background:#ff921c;color:#172b37;padding:14px 18px;font-size:17px;font-weight:800;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#d2f0f3}button.danger{background:#ffdad6}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1;min-width:0}.pill{display:inline-block;background:#c9f5e3;padding:7px 12px;border-radius:20px}.muted{color:#537080;font-size:14px}.warn{color:#a92222;background:#ffe3df;border-radius:12px;padding:10px}.ok{color:#08764d}.hidden{display:none}.big{font-size:30px;font-weight:900;color:#007f92}.step{color:#087f9b;font-weight:800}.line{border-bottom:1px solid #cde6ea;padding:10px 0}nav{display:flex;flex-wrap:wrap;gap:6px}nav button{flex:1}summary{cursor:pointer;font-weight:800}small{display:block}.progress{height:12px;background:#cce6e9;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:#ff921c;transition:width .2s}@media print{header,button,nav,.no-print,details{display:none!important}body{background:white}.card{box-shadow:none;border:1px solid #ddd}main{max-width:none}}</style></head><body><header><h1>🌊 H&A Jacks of All Trades</h1><div>🧰 Quote Builder · Painting Edition</div></header><main><div id="app"></div></main><script>
const KEY='ha-paint-v1';const defaults={wall:2.5,color:3,difficult:3.5,ceiling:3.3,premium:4,base:2.5,newbase:4,door:100,frame:45,materialMarkup:30,prep:[0,5,12,25,45],repair:[0,5,12,25,45],dailyTarget:1000,ownerDay:300,helperDay:125,momDay:200,ownerHour:30,targetHour:60};let store=JSON.parse(localStorage.getItem(KEY)||'{"jobs":[],"rates":null}');store.rates={...defaults,...store.rates};let job=null,screen='home',roomIndex=0,stage=0;const $=id=>document.getElementById(id),money=n=>(Number(n)||0).toLocaleString('en-US',{style:'currency',currency:'USD'}),num=n=>Math.max(0,Number(n)||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){if(job){job.updated=new Date().toISOString();let i=store.jobs.findIndex(x=>x.id===job.id);if(i<0)store.jobs.push(job);else store.jobs[i]=job}localStorage.setItem(KEY,JSON.stringify(store));let status=$('saved');if(status)status.textContent='✓ Saved '+new Date().toLocaleTimeString()}setInterval(save,60000);window.addEventListener('pagehide',save);function makeRoom(name){return{name,measure:[{l:0,h:8}],deductions:[],ceiling:0,ceilingType:'none',wallType:'standard',texture:'Smooth/light',repair:0,prep:0,furniture:0,doors:0,frames:0,base:0,newbase:0,coats:2,photos:[],notes:''}}function newJob(){job={id:Date.now().toString(),name:'',client:'',property:'Condo',created:new Date().toISOString(),updated:new Date().toISOString(),rooms:[],materials:0,days:0,momDays:0,original:null,changeOrders:[]};screen='setup';render()}function roomArea(r){return r.measure.reduce((s,m)=>s+num(m.l)*num(m.h),0)}function deduction(r){return r.deductions.reduce((s,d)=>s+num(d.w)*num(d.h),0)}function roomCost(r){let area=Math.max(0,roomArea(r)-deduction(r)),rate=store.rates[r.wallType==='color'?'color':r.wallType==='difficult'?'difficult':'wall'];let walls=area*rate*(num(r.coats)/2),ceil=num(r.ceiling)*(r.ceilingType==='premium'?store.rates.premium:r.ceilingType==='flat'?store.rates.ceiling:0);let base=num(r.base)*store.rates.base+num(r.newbase)*store.rates.newbase;let doors=num(r.doors)*store.rates.door+num(r.frames)*store.rates.frame;let sub=walls+ceil+base+doors;let extra=sub*(store.rates.prep[r.prep]+store.rates.repair[r.repair]+store.rates.prep[r.furniture])/100;return {area,walls,ceil,base,doors,extra,total:sub+extra}}function totals(){let labor=job.rooms.reduce((s,r)=>s+roomCost(r).total,0),materials=num(job.materials)*(1+store.rates.materialMarkup/100),total=labor+materials,cost=num(job.days)*(store.rates.ownerDay+store.rates.helperDay)+num(job.momDays)*store.rates.momDay+num(job.materials);return{labor,materials,total,cost,remaining:total-cost}}function title(s){return `<div class="card"><div class="step">${esc(job?.name||'New Estimate')}</div><h2>${s}</h2><div class="muted" id="saved">✓ Autosave enabled (this device)</div></div>`}function render(){let a=$('app');if(screen==='home'){a.innerHTML=`<div class="card"><h2>Welcome back! 👋</h2><button onclick="newJob()">➕ New painting quote</button><button class="secondary" onclick="screen='settings';render()">⚙️ Business settings</button><p class="muted">Other service categories coming later.</p></div><div class="card"><h2>📂 Saved jobs</h2><input id="search" placeholder="Search name, client, date…" oninput="showJobs()"><div id="jobs"></div></div>`;showJobs();return}if(screen==='settings'){a.innerHTML=`<div class="card"><h2>🔒 Business pricing settings</h2><p class="muted">Changes affect future calculations. Keep these consistent; existing signed quotes should be exported before changing rates.</p>${Object.keys(defaults).filter(k=>!Array.isArray(defaults[k])).map(k=>`<label>${esc(k)}</label><input type="number" step=".01" data-rate="${k}" value="${store.rates[k]}">`).join('')}<button onclick="updateRates()">Save pricing profile</button><button class="secondary" onclick="screen='home';render()">Back</button></div>`;return}if(screen==='setup'){a.innerHTML=title('🏠 Job details')+`<div class="card"><label>Job name</label><input id="jobname" value="${esc(job.name)}" placeholder="Aqua 406"><label>Client</label><input id="client" value="${esc(job.client)}" placeholder="Eddie"><label>Property type</label><select id="property">${['Condo','House','Garage','Shed','Commercial','Other'].map(x=>`<option ${job.property===x?'selected':''}>${x}</option>`).join('')}</select><button onclick="setupNext()">Next: Choose rooms ➜</button><button class="secondary" onclick="save();screen='home';render()">Save & exit</button></div>`;return}if(screen==='rooms'){a.innerHTML=title('🚪 Choose rooms')+`<div class="card"><p>Add each room you plan to paint.</p><div class="row"><select id="roomtype">${['Foyer','Bedroom','Bathroom','Kitchen','Living Room','Dining Room','Hallway','Closet','Utility Room','Laundry','Garage','Other'].map(x=>`<option>${x}</option>`).join('')}</select><button onclick="addRoom()">+ Add</button></div><div id="roomlist">${job.rooms.map((r,i)=>`<div class="line">${i+1}. ${esc(r.name)} <button class="danger" onclick="job.rooms.splice(${i},1);save();render()">×</button></div>`).join('')}</div><button onclick="roomIndex=0;stage=0;screen='wizard';save();render()" ${job.rooms.length?'':'disabled'}>Start room walkthrough ➜</button><button class="secondary" onclick="screen='setup';render()">Back</button></div>`;return}if(screen==='wizard'){if(roomIndex>=job.rooms.length){screen='review';render();return}let r=job.rooms[roomIndex],steps=['Wall measurements','Wall deductions','Surfaces and finish','Cosmetic repairs','Painting preparation','Fixtures and furniture','Room notes'];let body='';if(stage===0){body=`<p>Enter the combined length of walls sharing the same height. Tap + for a different wall height.</p>${r.measure.map((m,i)=>`<div class="row"><div><label>Length (ft)</label><input type="number" step=".01" value="${m.l}" onchange="setMeasure(${i},'l',this.value)"></div><div><label>Height (ft)</label><input type="number" step=".01" value="${m.h}" onchange="setMeasure(${i},'h',this.value)"></div><button class="danger" onclick="removeMeasure(${i})">×</button></div>`).join('')}<button class="secondary" onclick="rAddMeasure()">+ Add wall measurement</button><p class="big">${roomArea(r).toFixed(1)} sq ft</p>`}if(stage===1){body=`<p>Subtract only areas that won't be painted. Each deduction is width × height.</p>${r.deductions.map((d,i)=>`<div class="row"><input aria-label="Description" value="${esc(d.name)}" placeholder="Vanity / door" onchange="setDed(${i},'name',this.value)"><input aria-label="Width in feet" type="number" step=".01" value="${d.w}" onchange="setDed(${i},'w',this.value)"><input aria-label="Height in feet" type="number" step=".01" value="${d.h}" onchange="setDed(${i},'h',this.value)"><button class="danger" onclick="job.rooms[roomIndex].deductions.splice(${i},1);save();render()">×</button></div>`).join('')}<button class="secondary" onclick="rAddDed()">+ Add deduction</button><p>Gross: ${roomArea(r).toFixed(1)} sq ft · Deductions: ${deduction(r).toFixed(1)} sq ft</p><p class="big">Net: ${(roomArea(r)-deduction(r)).toFixed(1)} sq ft</p>${deduction(r)>roomArea(r)?'<div class="warn">🔴 Deductions exceed gross wall area. Recheck measurements.</div>':''}`;}if(stage===2){body=`${fieldSelect('Wall difficulty','wallType',[['standard','Standard'],['color','Major color change'],['difficult','Difficult surface']],r)}${fieldSelect('Wall texture','texture',[['Smooth/light','Smooth/light'],['Orange peel','Orange peel'],['Knockdown','Knockdown'],['Heavy','Heavy']],r)}<label>Wall finish coats</label><input type="number" min="1" max="10" value="${r.coats}" onchange="setRoom('coats',this.value)"><label>Ceiling area (sq ft)</label><input type="number" step=".01" value="${r.ceiling}" onchange="setRoom('ceiling',this.value)">${fieldSelect('Ceiling paint','ceilingType',[['none','Not painting'],['flat','Flat'],['premium','Premium washable']],r)}<div class="row"><div><label>Existing baseboard (ft)</label><input type="number" value="${r.base}" onchange="setRoom('base',this.value)"></div><div><label>New baseboard (ft)</label><input type="number" value="${r.newbase}" onchange="setRoom('newbase',this.value)"></div></div><div class="row"><div><label>Door faces</label><input type="number" value="${r.doors}" onchange="setRoom('doors',this.value)"></div><div><label>Door frames</label><input type="number" value="${r.frames}" onchange="setRoom('frames',this.value)"></div></div>`}if(stage===3)body=level('Cosmetic repair','repair',r)+'<p class="muted">Drywall patching, nail holes, caulking, sanding and minor surface repair.</p>';if(stage===4)body=level('Painting preparation','prep',r)+'<p class="muted">Masking, drop cloths, removing covers, protecting fixtures and setup.</p>';if(stage===5)body=level('Furniture moving','furniture',r)+'<p class="muted">Choose none if the room is empty or the owner has cleared it.</p>';if(stage===6)body=`<label>Room notes</label><textarea rows="4" onchange="setRoom('notes',this.value)">${esc(r.notes)}</textarea><p class="muted">Room photos will be added in a later version.</p>`;a.innerHTML=title(`Room ${roomIndex+1} of ${job.rooms.length}: ${esc(r.name)}`)+`<div class="card"><div class="step">Step ${stage+1} of ${steps.length}</div><div class="progress"><div style="width:${(stage+1)/steps.length*100}%"></div></div><h2 style="margin-top:15px">${steps[stage]}</h2>${body}<nav><button class="secondary" onclick="backStep()">← Back</button><button onclick="nextStep()">${stage===6?'Finish room ✓':'Next ➜'}</button></nav><button class="secondary" onclick="save();screen='rooms';render()">Room list</button><button class="secondary" onclick="save();screen='home';render()">Save & exit</button></div>`;return}if(screen==='review'){let t=totals();a.innerHTML=title('🧾 Estimate review')+`<div class="card"><h2>Room breakdown</h2>${job.rooms.map((r,i)=>{let c=roomCost(r);return `<div class="line"><strong>${esc(r.name)}</strong><div>${c.area.toFixed(1)} sq ft walls · ${money(c.total)}</div><button class="secondary" onclick="roomIndex=${i};stage=0;screen='wizard';render()">Edit room</button></div>`}).join('')}<label>Purchased materials ($)</label><input type="number" value="${job.materials}" onchange="job.materials=num(this.value);save();render()"><label>Estimated crew days (you + Brian)</label><input type="number" step=".5" value="${job.days}" onchange="job.days=num(this.value);save();render()"><label>Additional days for Mom</label><input type="number" step=".5" value="${job.momDays}" onchange="job.momDays=num(this.value);save();render()"><div class="line">Painting & prep: ${money(t.labor)}</div><div class="line">Materials with 30% markup: ${money(t.materials)}</div><div class="big">${money(t.total)}</div><details><summary>🔒 Private profitability check</summary><p>Estimated direct costs: ${money(t.cost)}</p><p>Remaining before overhead, taxes and profit: ${money(t.remaining)}</p><p>Labor revenue target: ${money(job.days*store.rates.dailyTarget)}</p><p class="muted">Owner $300/day, helper $125/day including bonus reserve; Mom $200/day when scheduled. This is not a customer-facing invoice.</p></details><button onclick="screen='customer';save();render()">Preview customer quote ➜</button><button class="secondary" onclick="screen='rooms';render()">Add / edit rooms</button><button class="secondary" onclick="save();screen='home';render()">Save & exit</button></div>`;return}if(screen==='customer'){let t=totals();a.innerHTML=`<div class="card"><h1>H&A Jacks of All Trades</h1><p>Painting Estimate · ${esc(job.name)}</p><p>Customer: ${esc(job.client)} · ${esc(job.property)}</p><p>Date: ${new Date().toLocaleDateString()}</p>${job.rooms.map(r=>`<div class="line">${esc(r.name)} — ${money(roomCost(r).total)}<small>${roomCost(r).area.toFixed(1)} sq ft wall area, ${r.coats} finish coats</small></div>`).join('')}<div class="line">Materials & supplies: ${money(t.materials)}</div><h2>Total: ${money(t.total)}</h2><p class="muted">Scope is limited to listed surfaces and specifications. Additional work requires approval by change order.</p></div><div class="no-print"><button onclick="window.print()">🖨️ Print / Save as PDF</button><button class="secondary" onclick="screen='review';render()">Back</button><button class="secondary" onclick="save();screen='home';render()">Save & exit</button></div>`;return}}
function fieldSelect(label,key,options,r){return `<label>${label}</label><select onchange="setRoom('${key}',this.value)">${options.map(([v,n])=>`<option value="${v}" ${r[key]===v?'selected':''}>${n}</option>`).join('')}</select>`}function level(label,key,r){return fieldSelect(label,key,[['0','None'],['1','Minimum'],['2','Medium'],['3','Heavy'],['4','Extreme']],{[key]:String(r[key])})}function setRoom(k,v){job.rooms[roomIndex][k]=['coats','ceiling','base','newbase','doors','frames','repair','prep','furniture'].includes(k)?num(v):v;save()}function setMeasure(i,k,v){job.rooms[roomIndex].measure[i][k]=num(v);save();if(stage===0)render()}function setDed(i,k,v){job.rooms[roomIndex].deductions[i][k]=k==='name'?v:num(v);save();if(k!=='name')render()}function rAddMeasure(){let r=job.rooms[roomIndex];r.measure.push({l:0,h:r.measure.at(-1)?.h||8});save();render()}function removeMeasure(i){let m=job.rooms[roomIndex].measure;if(m.length>1)m.splice(i,1);save();render()}function rAddDed(){job.rooms[roomIndex].deductions.push({name:'',w:0,h:0});save();render()}function nextStep(){save();if(stage<6)stage++;else{roomIndex++;stage=0}render()}function backStep(){if(stage>0)stage--;else if(roomIndex>0){roomIndex--;stage=6}else{screen='rooms'}render()}function setupNext(){job.name=$('jobname').value.trim()||'Untitled estimate';job.client=$('client').value.trim();job.property=$('property').value;save();screen='rooms';render()}function addRoom(){let name=$('roomtype').value;let count=job.rooms.filter(r=>r.name.startsWith(name)).length;job.rooms.push(makeRoom(name+(count?' '+(count+1):'')));save();render()}function showJobs(){let q=($('search')?.value||'').toLowerCase();$('jobs').innerHTML=store.jobs.filter(j=>(j.name+' '+j.client+' '+j.created).toLowerCase().includes(q)).sort((a,b)=>b.updated.localeCompare(a.updated)).map(j=>`<div class="line"><strong>${esc(j.name||'Untitled')}</strong><small>${esc(j.client)} · ${new Date(j.updated).toLocaleDateString()}</small><button onclick="openJob('${j.id}')">Continue ➜</button><button class="danger" onclick="deleteJob('${j.id}')">Delete</button></div>`).join('')||'<p class="muted">No saved jobs yet.</p>'}function openJob(id){job=store.jobs.find(j=>j.id===id);screen='review';render()}function deleteJob(id){if(confirm('Delete this saved job?')){store.jobs=store.jobs.filter(j=>j.id!==id);save();render()}}function updateRates(){document.querySelectorAll('[data-rate]').forEach(el=>store.rates[el.dataset.rate]=num(el.value));save();screen='home';render()}render();
</script></body></html>
