<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f9b"><title>H&A Quote Builder</title><style>:root{font-family:system-ui,sans-serif;color:#17384a;background:#e9f8fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#087f9b,#13b8ae);color:white;padding:22px 16px}main{max-width:760px;margin:auto;padding:16px}.card{background:white;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #12546a19}h1{margin:0;font-size:26px}h2{margin:0 0 14px}label{display:block;font-weight:700;margin:12px 0 5px}input,select,textarea{width:100%;padding:13px;border:2px solid #9bd7dd;border-radius:12px;font-size:17px;background:white}button{border:0;border-radius:13px;background:#ff921c;color:#172b37;padding:14px 18px;font-size:17px;font-weight:800;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#d2f0f3}button.danger{background:#ffdad6}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1;min-width:0}.pill{display:inline-block;background:#c9f5e3;padding:7px 12px;border-radius:20px}.muted{color:#537080;font-size:14px}.warn{color:#a92222;background:#ffe3df;border-radius:12px;padding:10px}.ok{color:#08764d}.hidden{display:none}.big{font-size:30px;font-weight:900;color:#007f92}.step{color:#087f9b;font-weight:800}.line{border-bottom:1px solid #cde6ea;padding:10px 0}nav{display:flex;flex-wrap:wrap;gap:6px}nav button{flex:1}summary{cursor:pointer;font-weight:800}small{display:block}.progress{height:12px;background:#cce6e9;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:#ff921c;transition:width .2s}@media print{header,button,nav,.no-print,details{display:none!important}body{background:white}.card{box-shadow:none;border:1px solid #ddd}main{max-width:none}}.measure-card{padding:14px;border:1px solid #c7e5e9;border-radius:15px;margin:12px 0;background:#f5fcfd}.measure-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}.feet-inch{display:grid;grid-template-columns:1fr 1fr;gap:6px}.feet-inch input{width:100%;min-width:0;padding:10px 6px}.feet-inch small{font-size:12px;color:#526d78}.measure-card .danger{margin-top:8px}@media(max-width:360px){.measure-grid{grid-template-columns:1fr}}.dashboard-grid .dash-day{min-height:52px;padding:5px 1px;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#eef7f8;border:2px solid transparent}.dashboard-grid .dash-day.busy{background:#b7eee3;border-color:#29a58c}.dashboard-grid .dash-day.active-day{outline:3px solid #f29324;outline-offset:-3px}.event-dot{font-size:11px;color:#08764d;white-space:nowrap}</style><style>.room-options{display:grid;gap:9px;margin:18px 0}.room-option{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border:2px solid #cfe8eb;border-radius:16px;background:#fff}.room-option.chosen{background:#e2f7ee;border-color:#35a987}.room-check{display:flex;align-items:center;gap:12px;flex:1;margin:0!important;font-size:18px;font-weight:700;cursor:pointer}.room-check input{width:26px;height:26px;min-width:26px;accent-color:#179d83;margin:0}.room-quantity{display:flex;align-items:center;gap:10px}.room-quantity button{width:43px!important;min-width:43px!important;padding:8px 0!important;margin:0!important;font-size:24px!important}.room-quantity strong{min-width:22px;text-align:center;font-size:19px}.selected-count{font-weight:800;color:#167a68;font-size:19px}@media(max-width:390px){.room-check{font-size:16px}.room-option{padding:9px 7px}.room-quantity{gap:5px}}.surface-option{display:flex;align-items:center;gap:14px;background:#f1fbfc;border:2px solid #cfe8eb;padding:16px;border-radius:14px;font-size:18px}.surface-option input{width:27px;height:27px;accent-color:#0d9b91} .measure-card{padding:14px;border:1px solid #c7e5e9;border-radius:15px;margin:12px 0;background:#f5fcfd}.measure-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}.feet-inch{display:grid;grid-template-columns:1fr 1fr;gap:6px}.feet-inch input{width:100%;min-width:0;padding:10px 6px}.feet-inch small{font-size:12px;color:#526d78}.measure-card .danger{margin-top:8px}@media(max-width:360px){.measure-grid{grid-template-columns:1fr}}</style><style>.sched-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.sched-grid button{padding:9px 0;margin:0;font-size:14px;border-radius:8px;background:#e5f5f7}.sched-grid button.selected{background:#087f9b;color:white}.sched-grid .dayname{text-align:center;font-size:12px;font-weight:700;color:#537080;padding:5px 0}.schedule-warning{background:#ffe4e2;border:2px solid #d12b2b;color:#991b1b;padding:9px;border-radius:12px;font-weight:800}.schedule-ok{background:#dff7ea;color:#086342;padding:9px;border-radius:12px;font-weight:700}.schedule-person{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d9edf0;padding:10px 0}.schedule-person button{font-size:14px;padding:8px;margin:0}.schedule-person.active{background:#e4f7fa}</style></head><body><header><h1>🌊 H&A Jacks of All Trades</h1><div>🧰 Quote Builder · Painting Edition · Scheduling Update 10</div></header><main><div id="app"></div></main><script>
const KEY='ha-paint-v4';const defaults={wall:2.5,color:3,difficult:3.5,ceiling:3.3,premium:4,base:2.5,newbase:4,crown:3.5,casing:2.75,decorative:3,door:100,frame:45,sprayWallMultiplier:1,sprayCeilingMultiplier:1,sprayDoorMultiplier:1,sprayTrimMultiplier:1,materialMarkup:30,prep:[0,5,12,25,45],repair:[0,5,12,25,45],dailyTarget:1000,ownerDay:300,helperDay:125,momDay:200,ownerHour:30,targetHour:60,workdayHours:8,employee1Hour:15.625,employee2Hour:25,employee3Hour:0,employee3Day:0};let store=JSON.parse(localStorage.getItem(KEY)||'{"jobs":[],"rates":null}');store.rates={...defaults,...store.rates};store.employeeNames={employee1:'Employee 1',employee2:'Employee 2',employee3:'Employee 3',...(store.employeeNames||{})};store.payTypes={owner:'daily',employee1:'daily',employee2:'daily',employee3:'daily',...(store.payTypes||{})};let job=null,screen='home',roomIndex=0,stage=0,schedulePerson='owner',scheduleMonth=new Date().getMonth(),scheduleYear=new Date().getFullYear(),dashboardMonth=new Date().getMonth(),dashboardYear=new Date().getFullYear(),dashboardDay=null;store.notes=Array.isArray(store.notes)?store.notes:[];const $=id=>document.getElementById(id),money=n=>(Number(n)||0).toLocaleString('en-US',{style:'currency',currency:'USD'}),num=n=>Math.max(0,Number(n)||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){if(job){job.updated=new Date().toISOString();let i=store.jobs.findIndex(x=>x.id===job.id);if(i<0)store.jobs.push(job);else store.jobs[i]=job}localStorage.setItem(KEY,JSON.stringify(store));let status=$('saved');if(status)status.textContent='✓ Saved '+new Date().toLocaleTimeString()}setInterval(save,60000);window.addEventListener('pagehide',save);function makeRoom(name){return{name,surfaces:['walls'],otherDescription:'',wallCondition:'Good',wallRepairs:[],ceilingRepairs:[],wallRepairNotes:'',ceilingRepairNotes:'',trimDetails:{},measure:[{l:0,li:0,h:8,hi:0}],deductions:[],ceilingMeasure:[{l:0,li:0,w:0,wi:0}],ceiling:0,ceilingCoats:2,ceilingType:'none',wallType:'standard',texture:'Smooth/light',repair:0,prep:0,furniture:0,doors:0,frames:0,paintMethods:{walls:'roll',ceilings:'roll',doors:'roll',trim:'roll'},base:0,newbase:0,coats:2,photos:[],notes:''}}function newJob(){job={id:Date.now().toString(),name:'',client:'',property:'Condo',created:new Date().toISOString(),updated:new Date().toISOString(),rooms:[],materials:0,days:0,momDays:0,original:null,changeOrders:[],schedule:{mode:'later',dates:{owner:[],employee1:[],employee2:[],employee3:[]}}};screen='setup';render()}function feet(ft,inch){return num(ft)+num(inch)/12}
function roomArea(r){return r.measure.reduce((s,m)=>s+feet(m.l,m.li)*feet(m.h,m.hi),0)}
function ceilingArea(r){return (r.ceilingMeasure||[]).reduce((s,m)=>s+feet(m.l,m.li)*feet(m.w,m.wi),0)}
function deduction(r){return r.deductions.reduce((s,d)=>s+feet(d.w,d.wi)*feet(d.h,d.hi),0)}function roomCost(r){let chosen=r.surfaces||['walls'];let area=chosen.includes('walls')?Math.max(0,roomArea(r)-deduction(r)):0,rate=store.rates[r.wallType==='color'?'color':r.wallType==='difficult'?'difficult':'wall'];let pm=r.paintMethods||{};let factor=k=>pm[k]==='spray'?num(store.rates['spray'+k[0].toUpperCase()+k.slice(1)+'Multiplier']??1):1;let walls=area*rate*(num(r.coats)/2)*factor('walls'),ceil=chosen.includes('ceilings')?(ceilingArea(r)||num(r.ceiling))*(r.ceilingType==='premium'?store.rates.premium:store.rates.ceiling)*(num(r.ceilingCoats??2)/2)*factor('ceilings'):0;let trimRates={baseboards:store.rates.base,crown:store.rates.crown,casing:store.rates.casing,windowtrim:store.rates.casing,decorative:store.rates.decorative};let base=Object.entries(trimRates).reduce((sum,[key,rate])=>sum+(chosen.includes(key)?feet(r.trimDetails?.[key]?.ft,r.trimDetails?.[key]?.inch)*rate*factor('trim'):0),0);base+=chosen.includes('casing')?num(r.frames)*store.rates.frame*factor('trim'):0;let doors=chosen.includes('doors')?num(r.doors)*store.rates.door*factor('doors'):0;let sub=walls+ceil+base+doors;let extra=sub*(store.rates.prep[r.prep]+store.rates.repair[r.repair]+store.rates.prep[r.furniture])/100;return {area,walls,ceil,base,doors,extra,total:sub+extra}}function dailyCost(who){let r=store.rates,p=store.payTypes||{},hours=num(r.workdayHours)||8;let day={owner:'ownerDay',employee1:'helperDay',employee2:'momDay',employee3:'employee3Day'}[who],hour={owner:'ownerHour',employee1:'employee1Hour',employee2:'employee2Hour',employee3:'employee3Hour'}[who];return p[who]==='hourly'?num(r[hour])*hours:num(r[day])}function totals(){let labor=job.rooms.reduce((s,r)=>s+roomCost(r).total,0),materials=num(job.materials)*(1+store.rates.materialMarkup/100),total=labor+materials,cost=num(job.days)*(dailyCost('owner')+dailyCost('employee1'))+num(job.momDays)*dailyCost('employee2')+num(job.materials);return{labor,materials,total,cost,remaining:total-cost}}function scheduleData(j){if(!j.schedule)j.schedule={mode:'later',dates:{owner:[],employee1:[],employee2:[],employee3:[]}};j.schedule.dates ||= {};for(const k of ['owner','employee1','employee2','employee3'])j.schedule.dates[k] ||= [];return j.schedule}
function scheduled(j){let x=scheduleData(j);return x.mode==='now'&&Object.values(x.dates).some(a=>a.length)}
function scheduleStatus(j){return scheduled(j)?'<span class="schedule-ok">✓ Scheduled</span>':'<span class="schedule-warning">🔴 NEEDS SCHEDULED</span>'}
function scheduleCalendar(){let d=scheduleData(job),names={owner:'Owner',...store.employeeNames},first=new Date(scheduleYear,scheduleMonth,1).getDay(),length=new Date(scheduleYear,scheduleMonth+1,0).getDate(),selected=d.dates[schedulePerson]||[];let cells=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(n=>'<div class="dayname">'+n+'</div>').join('')+Array(first).fill('<div></div>').join('');for(let day=1;day<=length;day++){let key=scheduleYear+'-'+String(scheduleMonth+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');cells+='<button type="button" class="'+(selected.includes(key)?'selected':'')+'" onclick="toggleScheduleDate(\''+key+'\')">'+day+'</button>'}return `<div class="card"><h2>📅 Job scheduling</h2><p class="muted">Choose workdays for yourself and each employee. Dates are saved on this device with the job. Shared employee calendars and client approval links require the upcoming secure online system.</p><label>Scheduling</label><select onchange="setScheduleMode(this.value)"><option value="later" ${d.mode==='later'?'selected':''}>Schedule later</option><option value="now" ${d.mode==='now'?'selected':''}>Select work dates</option></select>${scheduleStatus(job)}${d.mode==='now'?`<h3>Choose a person</h3>${Object.keys(names).map(k=>`<div class="schedule-person ${schedulePerson===k?'active':''}"><strong>${esc(names[k])}</strong><span>${d.dates[k].length} day(s)</span><button class="secondary" onclick="schedulePerson='${k}';render()">Select</button></div>`).join('')}<h3>${esc(names[schedulePerson])} — select dates</h3><div class="row"><button class="secondary" onclick="shiftScheduleMonth(-1)">◀</button><strong style="text-align:center">${new Date(scheduleYear,scheduleMonth,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}</strong><button class="secondary" onclick="shiftScheduleMonth(1)">▶</button></div><div class="sched-grid">${cells}</div><p class="muted">Tap dates to select or remove them. Choose another person to assign their days. The same date can be assigned to multiple people.</p>`:''}<button class="secondary" onclick="screen='review';save();render()">← Back to estimate</button></div>`}
function setScheduleMode(v){scheduleData(job).mode=v==='now'?'now':'later';save();render()}
function shiftScheduleMonth(n){let x=new Date(scheduleYear,scheduleMonth+n,1);scheduleYear=x.getFullYear();scheduleMonth=x.getMonth();render()}
function toggleScheduleDate(k){let d=scheduleData(job),a=d.dates[schedulePerson];d.dates[schedulePerson]=a.includes(k)?a.filter(x=>x!==k):[...a,k].sort();save();render()}
function title(s){return `<div class="card"><div class="step">${esc(job?.name||'New Estimate')}</div><h2>${s}</h2><div class="muted" id="saved">✓ Autosave enabled (this device; Phase 1 update)</div></div>`}const rateInfo={"wall":["Standard wall rate","Price per square foot for standard walls, based on two finish coats."],"color":["Color-change wall rate","Price per square foot for major color changes, based on two coats."],"difficult":["Difficult wall rate","Price per square foot for difficult wall surfaces, based on two coats."],"ceiling":["Standard ceiling rate","Price per square foot for standard ceilings, based on two coats."],"premium":["Premium ceiling rate","Price per square foot for premium washable ceiling finish."],"base":["Baseboard rate","Price per linear foot of existing baseboards."],"newbase":["New baseboard rate","Price per linear foot for new baseboard work; retained for existing estimates."],"crown":["Crown molding rate","Price per linear foot of crown molding."],"casing":["Casing rate","Price per linear foot of door casing; separate from complete door frames."],"decorative":["Decorative trim rate","Price per linear foot of decorative trim."],"door":["Door face rate","Price per painted side of a door; both sides count as two faces."],"frame":["Complete door frame rate","Price per complete door frame, when entered by quantity."],"materialMarkup":["Materials markup (%)","Percent added to actual purchased material cost."],"dailyTarget":["Daily revenue target ($)","Desired business revenue per workday; a planning target, not employee pay."],"ownerDay":["Owner daily labor cost ($)","Internal estimated cost of one owner workday."],"helperDay":["Employee 1 daily labor cost ($)","Internal labor cost for one paid workday for Employee 1."],"momDay":["Employee 2 daily labor cost ($)","Internal labor cost for one paid workday for Employee 2."],"ownerHour":["Owner hourly labor cost ($)","Internal estimated owner labor cost per hour."],"targetHour":["Target billable hourly revenue ($)","Revenue target per billable hour."],"workdayHours":["Hours in a standard workday","Used to convert hourly wages into estimated daily labor costs."],"employee1Hour":["Employee 1 hourly pay ($)","Hourly wage used when Employee 1 is set to hourly pay."],"employee2Hour":["Employee 2 hourly pay ($)","Hourly wage used when Employee 2 is set to hourly pay."],"employee3Hour":["Employee 3 hourly pay ($)","Hourly wage used when Employee 3 is set to hourly pay."],"employee3Day":["Employee 3 daily flat rate ($)","Daily labor cost when Employee 3 is set to flat daily pay."],"sprayWallMultiplier":["Spray walls price multiplier","1.00 means same as rolling; adjust only after validating spray labor and masking."],"sprayCeilingMultiplier":["Spray ceilings price multiplier","1.00 means same as rolling; configure for spray preparation and production."],"sprayDoorMultiplier":["Spray door faces price multiplier","1.00 means same as rolling; applies only to door faces."],"sprayTrimMultiplier":["Spray trim / frames price multiplier","1.00 means same as rolling; applies to linear trim and complete frames."]};function calendarDashboard(){let names={owner:'Owner',...store.employeeNames},byDate={},unscheduled=[];for(const j of store.jobs){if(!scheduled(j)){unscheduled.push(j);continue}for(const [person,dates] of Object.entries(scheduleData(j).dates)){for(const date of dates){(byDate[date] ||= []).push({person,job:j})}}}let first=new Date(dashboardYear,dashboardMonth,1).getDay(),count=new Date(dashboardYear,dashboardMonth+1,0).getDate();let prefix=dashboardYear+'-'+String(dashboardMonth+1).padStart(2,'0')+'-';let keys=Object.keys(byDate).filter(x=>x.startsWith(prefix)).sort();let chosen=dashboardDay&&dashboardDay.startsWith(prefix)?dashboardDay:(keys[0]||null);let cells=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>'<div class="dayname">'+x+'</div>').join('')+Array(first).fill('<div></div>').join('');for(let d=1;d<=count;d++){let key=prefix+String(d).padStart(2,'0'),events=byDate[key]||[];cells+=`<button type="button" class="dash-day ${events.length?'busy':''} ${chosen===key?'active-day':''}" onclick="dashboardDay='${key}';render()"><span>${d}</span>${events.length?`<span class="event-dot">● ${events.length}</span>`:''}</button>`}let dayEvents=chosen?(byDate[chosen]||[]):[];return `<div class="card"><h2>📅 Scheduling dashboard</h2><p class="muted">Dates are automatically pulled from saved job schedules on this device. Employee names match Business Settings.</p><button class="secondary" onclick="screen='home';render()">← Home</button><div class="row"><button class="secondary" onclick="shiftDashboardMonth(-1)">◀</button><strong style="text-align:center">${new Date(dashboardYear,dashboardMonth,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}</strong><button class="secondary" onclick="shiftDashboardMonth(1)">▶</button></div><div class="sched-grid dashboard-grid">${cells}</div><p class="muted">Highlighted days have assigned work. Tap a date to see the job and crew.</p><h3>${chosen?esc(new Date(chosen+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})):'Select a date'}</h3>${dayEvents.length?dayEvents.map(x=>`<div class="line"><strong>${esc(x.job.name||'Untitled')}</strong><div>${esc(names[x.person]||x.person)} · ${esc(x.job.client||'No client entered')}</div><button class="secondary" onclick="openJob('${x.job.id}');screen='schedule';render()">View / edit schedule</button></div>`).join(''):'<p class="muted">No assigned work on this date.</p>'}<h3>🔴 Needs scheduled (${unscheduled.length})</h3>${unscheduled.length?unscheduled.map(j=>`<div class="line"><strong>${esc(j.name||'Untitled')}</strong><div class="schedule-warning">🔴 NEEDS SCHEDULED</div><button class="secondary" onclick="openJob('${j.id}');screen='schedule';render()">Schedule job</button></div>`).join(''):'<p class="ok">All saved jobs have scheduled dates.</p>'}</div>${notesPanel()}`}
function shiftDashboardMonth(delta){let d=new Date(dashboardYear,dashboardMonth+delta,1);dashboardYear=d.getFullYear();dashboardMonth=d.getMonth();dashboardDay=null;render()}
function notesPanel(){return `<div class="card"><h2>📝 Quick reminders</h2><p class="muted">Personal notes, material pickups, or anything you need to remember. Saved on this device and always shown below your scheduling calendar.</p><button class="secondary" onclick="screen='notes';render()">＋ Add note</button>${store.notes.length?store.notes.slice().reverse().map(n=>`<div class="line"><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(n.text)}</div><small class="muted">${esc(new Date(n.created).toLocaleString())}</small><button class="secondary" onclick="editQuickNote('${n.id}')">Edit</button><button class="danger" onclick="deleteQuickNote('${n.id}')">Delete</button></div>`).join(''):'<p class="muted">No reminders yet.</p>'}</div>`}
let editingNoteId=null;function notesEditor(){let note=store.notes.find(n=>n.id===editingNoteId);return `<div class="card"><h2>📝 ${note?'Edit reminder':'Add quick note'}</h2><p class="muted">For supplies to pick up, job reminders, or anything else.</p><textarea id="quick-note-text" rows="6" placeholder="Example: Pick up two gallons of primer for the Smith job">${esc(note?.text||'')}</textarea><button onclick="saveQuickNote()">Save note</button><button class="secondary" onclick="screen='calendar';editingNoteId=null;render()">Cancel / back to calendar</button></div>${notesPanel()}`}
function saveQuickNote(){let value=$('quick-note-text').value.trim();if(!value){alert('Type a note before saving.');return}let n=store.notes.find(x=>x.id===editingNoteId);if(n)n.text=value;else store.notes.push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2,6),text:value,created:new Date().toISOString()});editingNoteId=null;save();screen='calendar';render()}
function editQuickNote(id){editingNoteId=id;screen='notes';render()}

function render(){let a=$('app');if(screen==='schedule'){a.innerHTML=title('Employee work dates')+scheduleCalendar();return}if(screen==='calendar'){a.innerHTML=calendarDashboard();return}if(screen==='notes'){a.innerHTML=notesEditor();return}if(screen==='home'){a.innerHTML=`<div class="card"><h2>Welcome back! 👋</h2><button onclick="newJob()">➕ New painting quote</button><button class="secondary" onclick="screen='calendar';render()">📅 Scheduling dashboard</button><button class="secondary" onclick="screen='settings';render()">⚙️ Business settings</button><p class="muted">Other service categories coming later.</p></div><div class="card"><h2>📅 Scheduling overview</h2><p class="muted">See all scheduled jobs and workdays for yourself and your employees, or find jobs waiting for dates.</p><button class="secondary" onclick="screen='calendar';render()">Open scheduling calendar ➜</button></div><div class="card"><h2>📝 Quick notes</h2><p class="muted">Keep material pickup reminders and other notes handy.</p><button class="secondary" onclick="editingNoteId=null;screen='notes';render()">＋ Add note</button><p class="muted">${store.notes.length} saved reminder(s) · shown below the calendar</p></div><div class="card"><h2>📂 Saved jobs</h2><input id="search" placeholder="Search name, client, date…" oninput="showJobs()"><div id="jobs"></div></div>`;showJobs();return}if(screen==='settings'){a.innerHTML=`<div class="card"><h2>🔒 Business pricing settings</h2><p class="muted">Changes affect future calculations. Keep these consistent; existing signed quotes should be exported before changing rates.</p>${Object.keys(defaults).filter(k=>!Array.isArray(defaults[k])).map(k=>`<label>${esc(rateInfo[k]?.[0]||k)}</label><p class="muted">${esc(rateInfo[k]?.[1]||'Editable pricing value used by the estimate calculator.')}</p><input type="number" step=".01" data-rate="${k}" value="${store.rates[k]}">`).join('')}<h3>Labor pay method</h3><p class="muted">Choose hourly or a fixed amount per workday. Hourly ss="card"><p class="muted">Check each room type. Use + or − for multiple rooms of the same type.</p><div class="room-options">${types.map(t=>`<div class="room-option ${counts[t]?'chosen':''}"><label class="room-check"><input type="checkbox" ${counts[t]?'checked':''} onchange="toggleRoomType('${t}',this.checked)"><span>${esc(t)}</span></label><div class="room-quantity"><button class="secondary" aria-label="Remove one ${esc(t)}" onclick="changeRoomCount('${t}',-1)" ${counts[t]?'':'disabled'}>−</button><strong>${counts[t]}</strong><button class="secondary" aria-label="Add one ${esc(t)}" onclick="changeRoomCount('${t}',1)">+</button></div></div>`).join('')}</div><p class="selected-count">✓ ${job.rooms.length} room${job.rooms.length===1?'':'s'} selected</p><button onclick="roomIndex=0;stage=0;screen='wizard';save();render()" ${job.rooms.length?'':'disabled'}>Start room walkthrough ➜</button><button class="secondary" onclick="screen='setup';render()">Back</button></div>`;return}if(screen==='wizard'){if(roomIndex>=job.rooms.length){screen='review';render();return}let r=job.rooms[roomIndex],chosen=r.surfaces||['walls'];let steps=['What are we painting?','Wall measurements','Wall deductions','Ceiling measurements','Surfaces and finish','Trim & details','Cosmetic repairs','Painting preparation','Fixtures and furniture','Room notes'];let body='';if(stage===0){body=`<p class="muted">Check everything included in ${esc(r.name)}. Unchecked surfaces will not be priced.</p>${[['walls','Walls'],['ceilings','Ceilings'],['baseboards','Baseboards'],['crown','Crown molding'],['doors','Door faces'],['casing','Door frames / casing'],['windowtrim','Window trim / casing'],['decorative','Chair rail / decorative trim'],['other','Other']].map(([key,label])=>`<label class="surface-option"><input type="checkbox" ${chosen.includes(key)?'checked':''} onchange="toggleSurface('${key}',this.checked)"> ${label}</label>`).join('')}${chosen.includes('other')?`<label>Describe other painting work</label><textarea placeholder="Cabinets, beams, railings…" onchange="setRoom('otherDescription',this.value)">${esc(r.otherDescription||'')}</textarea><p class="muted">Custom work is included in the scope but must be priced separately; it is not automatically added to the total.</p>`:''}`;}if(stage===1){body=`<p>Enter the combined linear length of walls sharing the same height. Feet and inches are separate.</p>${r.measure.map((m,i)=>`<div class="measure-card"><strong>Wall measurement ${i+1}</strong><div class="measure-grid">${dimFields('Total wall length',m,'l','li',`setMeasure(${i},`,')')}${dimFields('Wall height',m,'h','hi',`setMeasure(${i},`,')')}</div><button class="danger" onclick="removeMeasure(${i})">Remove row</button></div>`).join('')}<button class="secondary" onclick="rAddMeasure()">+ Add wall measurement</button><p class="big">${roomArea(r).toFixed(2)} sq ft</p>`}if(stage===2){body=`<p>Subtract only areas that won't be painted.</p>${r.deductions.map((d,i)=>`<div class="measure-card"><input aria-label="Deduction description" value="${esc(d.name||'')}" placeholder="Vanity / shower / door" onchange="setDed(${i},'name',this.value)"><div class="measure-grid">${dimFields('Width',d,'w','wi',`setDed(${i},`,')')}${dimFields('Height',d,'h','hi',`setDed(${i},`,')')}</div><button class="danger" onclick="job.rooms[roomIndex].deductions.splice(${i},1);save();render()">Remove deduction</button></div>`).join('')}<button class="secondary" onclick="rAddDed()">+ Add deduction</button><p>Gross: ${roomArea(r).toFixed(2)} sq ft · Deductions: ${deduction(r).toFixed(2)} sq ft</p><p class="big">Net: ${(roomArea(r)-deduction(r)).toFixed(2)} sq ft</p>${deduction(r)>roomArea(r)?'<div class="warn">🔴 Deductions exceed gross wall area. Recheck measurements.</div>':''}`;}if(stage===3){body=`<p>Measure each ceiling section by length × width. Use feet and inches for both dimensions.</p>${(r.ceilingMeasure||[]).map((m,i)=>`<div class="measure-card"><strong>Ceiling section ${i+1}</strong><div class="measure-grid">${dimFields('Length',m,'l','li',`setCeilingMeasure(${i},`,')')}${dimFields('Width',m,'w','wi',`setCeilingMeasure(${i},`,')')}</div><button class="danger" onclick="removeCeilingMeasure(${i})">Remove section</button></div>`).join('')}<button class="secondary" onclick="addCeilingMeasure()">+ Add ceiling section</button><p class="big">${ceilingArea(r).toFixed(2)} sq ft</p>`;}if(stage===4){body=`${chosen.includes('walls')?fieldSelect('Wall difficulty','wallType',[['standard','Standard'],['color','Major color change'],['difficult','Difficult surface']],r)+fieldSelect('Wall texture','texture',[['Smooth/light','Smooth/light'],['Orange peel','Orange peel'],['Knockdown','Knockdown'],['Heavy','Heavy']],r)+fieldSelect('Wall condition','wallCondition',[['Good','Good'],['Minor repairs','Minor repairs'],['Stained','Stained / needs primer'],['Damaged','Damaged']],r)+(r.wallCondition==='Damaged'?repairChecklist('wall',r):'')+`<label>Wall finish coats</label><input type="number" min="1" max="10" value="${r.coats}" onchange="setRoom('coats',this.value)">`:''}${chosen.includes('ceilings')?`<p class="big">Ceiling: ${ceilingArea(r).toFixed(2)} sq ft</p>${fieldSelect('Ceiling texture','ceilingTexture',[['Smooth','Smooth'],['Orange peel','Orange peel'],['Knockdown','Knockdown'],['Popcorn','Popcorn'],['Other','Other']],r)}${fieldSelect('Ceiling condition','ceilingCondition',[['Good','Good'],['Minor repairs','Minor repairs'],['Stained','Stained / needs primer'],['Damaged','Damaged']],r)}${r.ceilingCondition==='Damaged'?repairChecklist('ceiling',r):''}<label>Ceiling finish coats</label><input type="number" min="1" max="10" value="${r.ceilingCoats??2}" onchange="setRoom('ceilingCoats',this.value)">${fieldSelect('Ceiling paint','ceilingType',[['flat','Flat'],['premium','Premium washable']],{...r,ceilingType:r.ceilingType==='none'?'flat':r.ceilingType})}`:''}${chosen.includes('doors')?`<label>Number of door faces to paint (count each side)</label><input type="number" value="${r.doors}" onchange="setRoom('doors',this.value)">`:''}${chosen.includes('casing')?`<label>Number of door frames to paint</label><input type="number" min="0" value="${r.frames||0}" onchange="setRoom('frames',this.value)"><p class="muted">Count complete frames here; linear-foot casing measurements below are priced separately. Avoid counting the same frame twice.</p>`:''}${chosen.some(x=>['walls','ceilings','doors','casing','baseboards','crown','windowtrim','decorative'].includes(x))?`<h3>Application method</h3><p class="muted">Choose Spray or Roll for each surface. Spray price adjustments are editable in settings and default to 1.00× (no change) until calibrated.</p>${[['walls','Walls'],['ceilings','Ceilings'],['doors','Door faces'],['trim','Trim / frames']].filter(([k])=>k==='trim'?chosen.some(x=>['casing','baseboards','crown','windowtrim','decorative'].includes(x)):chosen.includes(k)).map(([k,n])=>`<label>${n} method</label><select onchange="setMethod('${k}',this.value)"><option value="roll" ${(r.paintMethods?.[k]||'roll')==='roll'?'selected':''}>Roll</option><option value="spray" ${r.paintMethods?.[k]==='spray'?'selected':''}>Spray</option></select>`).join('')}`:''}${chosen.includes('other')?`<p><strong>Other:</strong> ${esc(r.otherDescription||'Not described yet')}</p><p class="warn">Other work needs a separate price before this estimate is final.</p>`:''}`;}if(stage===5){let trimTypes=[['baseboards','Baseboards'],['crown','Crown molding'],['casing','Door frames / casing'],['windowtrim','Window trim / casing'],['decorative','Decorative trim']].filter(([k])=>chosen.includes(k));body=trimTypes.length?trimTypes.map(([k,n])=>trimEditor(k,n,r)).join(''):'<p>No trim selected.</p>';}if(stage===6)body=level('Cosmetic repair','repair',r)+'<p class="muted">Drywall patching, nail holes, caulking, sanding and minor surface repair.</p>';if(stage===7)body=level('Painting preparation','prep',r)+'<p class="muted">Masking, drop cloths, removing covers, protecting fixtures and setup.</p>';if(stage===8)body=level('Furniture moving','furniture',r)+'<p class="muted">Choose none if the room is empty or the owner has cleared it.</p>';if(stage===9)body=`<label>Room notes</label><textarea rows="4" onchange="setRoom('notes',this.value)">${esc(r.notes)}</textarea><p class="muted">Room photos will be added in a later version.</p>`;a.innerHTML=title(`Room ${roomIndex+1} of ${job.rooms.length}: ${esc(r.name)}`)+`<div class="card"><div class="step">Step ${stage+1} of ${steps.length}</div><div class="progress"><div style="width:${(stage+1)/steps.length*100}%"></div></div><h2 style="margin-top:15px">${steps[stage]}</h2>${body}<nav><button class="secondary" onclick="backStep()">← Back</button><button onclick="nextStep()">${stage===9?'Finish room ✓':'Next ➜'}</button></nav><button class="secondary" onclick="save();screen='rooms';render()">Room list</button><button class="secondary" onclick="save();screen='home';render()">Save & exit</button></div>`;return}function roomScope(r){let chosen=r.surfaces||['walls'],parts=[];if(chosen.includes('walls'))parts.push('Walls: '+Math.max(0,roomArea(r)-deduction(r)).toFixed(1)+' sq ft');if(chosen.includes('ceilings'))parts.push('Ceilings: '+(ceilingArea(r)||num(r.ceiling)).toFixed(1)+' sq ft');if(chosen.includes('doors')&&num(r.doors))parts.push(num(r.doors)+' door face'+(num(r.doors)===1?'':'s'));if(chosen.includes('casing')&&num(r.frames))parts.push(num(r.frames)+' door frame'+(num(r.frames)===1?'':'s'));for(let [k,label] of Object.entries({baseboards:'Baseboards',crown:'Crown molding',casing:'Door casing',windowtrim:'Window trim',decorative:'Decorative trim'})){if(chosen.includes(k)){let d=r.trimDetails?.[k]||{},ft=feet(d.ft,d.inch);if(ft)parts.push(label+': '+ft.toFixed(1)+' linear ft')}}if(chosen.includes('other'))parts.push('Other: '+(r.otherDescription||'Not specified'));return parts.length?parts:['No measured painting surfaces']}function roomScopeHtml(r){return roomScope(r).map(x=>'<div>'+esc(x)+'</div>').join('')}if(screen==='review'){let t=totals();a.innerHTML=title('🧾 Estimate review')+`<div class="card"><h2>Room breakdown</h2>${job.rooms.map((r,i)=>{let c=roomCost(r);return `<div class="line"><strong>${esc(r.name)}</strong><div>${money(c.total)}<div class="muted">${roomScopeHtml(r)}</div></div><button class="secondary" onclick="roomIndex=${i};stage=0;screen='wizard';render()">Edit room</button></div>`}).join('')}<label>Purchased materials ($)</label><input type="number" value="${job.materials}" onchange="job.materials=num(this.value);save();render()">${scheduleStatus(job)}<p class="muted">You can schedule workdays now or later. Selecting dates does not change the estimated labor amounts below.</p><button class="secondary" onclick="screen='schedule';render()">📅 Schedule owner and employees</button><label>Estimated job days</label><p class="muted">How many days do you expect the entire job to take? Assign individual work dates in the scheduling calendar above.</p><input type="number" min="0" step=".5" value="${job.days}" onchange="job.days=num(this.value);save();render()"><div class="line">Painting & prep: ${money(t.labor)}</div><div class="line">Materials with ${store.rates.materialMarkup}% markup: ${money(t.materials)}</div><div class="big">${money(t.total)}</div><details><summary>🔒 Private profitability check</summary><p>Estimated direct costs: ${money(t.cost)}</p><p>Remaining before overhead, taxes and profit: ${money(t.remaining)}</p><p>Labor revenue target: ${money(job.days*store.rates.dailyTarget)}</p><p class="muted">Internal cost estimate uses existing crew pay assumptions. Legacy extra-employee days from older estimates are retained for compatibility but are no longer editable here. This is not a customer-facing invoice.</p></details><button onclick="screen='customer';save();render()">Preview customer quote ➜</button><button class="secondary" onclick="screen='rooms';render()">Add / edit rooms</button><button class="secondary" onclick="save();screen='home';render()">Save function repairChecklist(type,r){let opts=type==='wall'?['Cracks','Nail or screw pops','Small drywall holes','Large drywall holes','Water damage','Peeling paint','Texture repair','Corner bead','Drywall replacement','Other']:['Cracks','Nail or screw pops','Small drywall holes','Large drywall holes','Water damage','Peeling paint','Popcorn texture repair','Texture matching','Drywall replacement','Other'];let key=type+'Repairs',note=type+'RepairNotes';return `<div class="measure-card"><strong>${type==='wall'?'Wall':'Ceiling'} repairs needed</strong><p class="muted">Check all that apply. Repair pricing is not automatically included by this checklist.</p>${opts.map(x=>`<label class="surface-option"><input type="checkbox" ${(r[key]||[]).includes(x)?'checked':''} onchange="toggleRepair('${type}','${x}',this.checked)"> ${x}</label>`).join('')}<label>Repair notes / quantities</label><textarea onchange="setRoom('${note}',this.value)">${esc(r[note]||'')}</textarea></div>`}

function trimEditor(key,name,r){let d=r.trimDetails?.[key]||{};return `<details class="measure-card" open><summary>${name} — paint finish</summary><label>Work type</label><select onchange="setTrim('${key}','work',this.value)">${[['paint','Paint existing'],['paintnew','Paint new trim'],['install','Install only — price separately'],['installpaint','Install and paint — installation priced separately'],['replace','Remove and replace — price separately']].map(([v,n])=>`<option value="${v}" ${(d.work||'paint')===v?'selected':''}>${n}</option>`).join('')}</select><div class="measure-grid">${dimFields('Linear length',d,'ft','inch',`setTrim('${key}',`,')')}</div><label>Condition</label><select onchange="setTrim('${key}','condition',this.value)">${['Good','Minor repairs','Damaged'].map(x=>`<option ${d.condition===x?'selected':''}>${x}</option>`).join('')}</select>${d.condition==='Damaged'?`<label>Repair description</label><textarea onchange="setTrim('${key}','repairNotes',this.value)">${esc(d.repairNotes||'')}</textarea>`:''}<label>Number of coats</label><input type="number" min="1" value="${d.coats||2}" onchange="setTrim('${key}','coats',this.value)"><p class="muted">Painting rate is preliminary. Installation, replacement and repairs require separate pricing.</p></details>`}
function setTrim(key,field,value){let r=job.rooms[roomIndex];r.trimDetails ||= {};r.trimDetails[key] ||= {};r.trimDetails[key][field]=['ft','inch','coats'].includes(field)?num(value):value;save();if(field==='condition')render()}
function fieldSelect(label,key,options,r){return `<label>${label}</label><select onchange="setRoom('${key}',this.value)">${options.map(([v,n])=>`<option value="${v}" ${r[key]===v?'selected':''}>${n}</option>`).join('')}</select>`}function level(label,key,r){return fieldSelect(label,key,[['0','None'],['1','Minimum'],['2','Medium'],['3','Heavy'],['4','Extreme']],{[key]:String(r[key])})}function dimFields(label,m,ftKey,inKey,prefix,suffix){return `<div><label>${label}</label><div class="feet-inch"><div><small>Feet</small><input type="number" min="0" step="1" value="${m[ftKey]??0}" onchange="${prefix}'${ftKey}',this.value${suffix}"></div><div><small>Inches</small><input type="number" min="0" step=".25" value="${m[inKey]??0}" onchange="${prefix}'${inKey}',this.value${suffix}"></div></div></div>`}
function setCeilingMeasure(i,k,v){job.rooms[roomIndex].ceilingMeasure[i][k]=num(v);save();render()}
function addCeilingMeasure(){(job.rooms[roomIndex].ceilingMeasure ||= []).push({l:0,li:0,w:0,wi:0});save();render()}
function removeCeilingMeasure(i){let m=job.rooms[roomIndex].ceilingMeasure;if(m.length>1)m.splice(i,1);save();render()}
function setRoom(k,v){job.rooms[roomIndex][k]=['coats','ceiling','ceilingCoats','base','newbase','doors','frames','repair','prep','furniture'].includes(k)?num(v):v;save();if(['wallCondition','ceilingCondition'].includes(k))render()}function setMeasure(i,k,v){job.rooms[roomIndex].measure[i][k]=num(v);save();if(stage===1)render()}function setDed(i,k,v){job.rooms[roomIndex].deductions[i][k]=k==='name'?v:num(v);save();if(k!=='name')render()}function rAddMeasure(){let r=job.rooms[roomIndex];r.measure.push({l:0,li:0,h:r.measure.at(-1)?.h||8,hi:r.measure.at(-1)?.hi||0});save();render()}function removeMeasure(i){let m=job.rooms[roomIndex].measure;if(m.length>1)m.splice(i,1);save();render()}function rAddDed(){job.rooms[roomIndex].deductions.push({name:'',w:0,h:0});save();render()}function toggleSurface(key,checked){let r=job.rooms[roomIndex];r.surfaces=r.surfaces||['walls'];r.surfaces=checked?[...new Set([...r.surfaces,key])]:r.surfaces.filter(x=>x!==key);if(key==='ceilings'&&checked){if(r.ceilingType==='none')r.ceilingType='flat';r.ceilingMeasure ||= [{l:0,li:0,w:0,wi:0}];}save();render()}function skipStage(){let r=job.rooms[roomIndex],c=r.surfaces||['walls'];if(stage===1||stage===2)return !c.includes('walls');if(stage===3)return !c.includes('ceilings');if(stage===4)return !c.some(x=>['walls','ceilings','doors','other'].includes(x));if(stage===5)return !c.some(x=>['baseboards','crown','casing','windowtrim','decorative'].includes(x));return false}function nextStep(){save();if(stage<9){do{stage++}while(stage<9&&skipStage())}else{roomIndex++;stage=0}render()}function backStep(){if(stage>0){do{stage--}while(stage>0&&skipStage())}else if(roomIndex>0){roomIndex--;stage=9}else{screen='rooms'}render()}function setupNext(){job.name=$('jobname').value.trim()||'Untitled estimate';job.client=$('client').value.trim();job.property=$('property').value;save();screen='rooms';render()}function roomMatchesType(name,type){if(name===type)return true;if(!name.startsWith(type+' '))return false;let suffix=name.slice(type.length+1);return /^[0-9]+$/.test(suffix)}function changeRoomCount(type,delta){let matches=job.rooms.filter(r=>roomMatchesType(r.name,type));if(delta>0){let used=new Set(matches.map(r=>r.name));let n=1;while(used.has(n===1?type:type+' '+n))n++;job.rooms.push(makeRoom(n===1?type:type+' '+n))}else if(matches.length){let last=matches[matches.length-1];job.rooms.splice(job.rooms.indexOf(last),1)}save();render()}function toggleRoomType(type,checked){let matches=job.rooms.filter(r=>roomMatchesType(r.name,type));if(checked&&!matches.length)changeRoomCount(type,1);else if(!checked&&matches.length){job.rooms=job.rooms.filter(r=>!roomMatchesType(r.name,type));save();render()}}function addRoom(){let name=$('roomtype').value;let count=job.rooms.filter(r=>r.name.startsWith(name)).length;job.rooms.push(makeRoom(name+(count?' '+(count+1):'')));save();render()}function showJobs(){let q=($('search')?.value||'').toLowerCase();$('jobs').innerHTML=store.jobs.filter(j=>(j.name+' '+j.client+' '+j.created).toLowerCase().includes(q)).sort((a,b)=>b.updated.localeCompare(a.updated)).map(j=>`<div class="line"><strong>${esc(j.name||'Untitled')}</strong><small>${esc(j.client)} · ${new Date(j.updated).toLocaleDateString()}</small>${scheduleStatus(j)}<button onclick="openJob('${j.id}')">Continue ➜</button><button class="danger" onclick="deleteJob('${j.id}')">Delete</button></div>`).join('')||'<p class="muted">No saved jobs yet.</p>'}function openJob(id){job=store.jobs.find(j=>j.id===id);screen='review';render()}function deleteJob(id){if(confirm('Delete this saved job?')){store.jobs=store.jobs.filter(j=>j.id!==id);save();render()}}function setMethod(k,v){let r=job.rooms[roomIndex];r.paintMethods ||= {};r.paintMethods[k]=v==='spray'?'spray':'roll';save()}function updateRates(){document.querySelectorAll('[data-paytype]').forEach(el=>store.payTypes[el.dataset.paytype]=el.value);document.querySelectorAll('[data-employee]').forEach(el=>store.employeeNames[el.dataset.employee]=el.value.trim()||el.dataset.employee.replace('employee','Employee '));document.querySelectorAll('[data-rate]').forEach(el=>store.rates[el.dataset.rate]=num(el.value));save();screen='home';render()}render();
</script></body></html>
